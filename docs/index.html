<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>页面复刻结果浏览</title>
    <style>
        :root {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --ink: #1f2328;
            --muted: #656d76;
            --rule: #d0d7de;
            --accent: #0969da;
            --accent2: #1f883d;
            --accent3: #7c3aed;
            --warn: #d1242f;
            --amber: #b45309;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-width: 1200px;
            overflow-x: auto;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--ink);
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--rule);
            padding: 1rem 1.5rem;
        }
        header h1 { margin: 0; font-size: 1.2rem; }
        header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.85rem; }
        main { padding: 1rem 1.5rem; min-width: 1200px; margin: 0 auto; }
        .card {
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
        select, input[type="number"] {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--rule);
            border-radius: 6px;
            font-size: 0.95rem;
            min-width: 160px;
        }
        button {
            padding: 0.55rem 1.2rem;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button.secondary { background: var(--accent2); }
        button.danger { background: var(--warn); }
        button.purple { background: var(--accent3); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { font-size: 0.9rem; color: var(--muted); margin-top: 0.5rem; }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .stats-table th, .stats-table td {
            border: 1px solid var(--rule);
            padding: 0.55rem 0.65rem;
            text-align: left;
        }
        .stats-table th {
            background: #f3f4f6;
            font-weight: 600;
            white-space: nowrap;
        }
        .stats-table tr:hover { background: #f6f8fa; }
        .stats-table .num { text-align: center; white-space: nowrap; }
        .stats-table .ok { color: var(--accent2); font-weight: 600; }
        .stats-table .warn { color: var(--warn); font-weight: 600; }
        .preview-wrapper {
            min-width: 1100px;
            overflow-x: auto;
            border: 1px solid var(--rule);
            border-radius: 6px;
            background: var(--surface);
        }
        iframe {
            width: 100%;
            min-width: 1100px;
            height: 1200px;
            border: none;
            display: block;
        }
        .actions { margin-bottom: 0.75rem; }
        .actions a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
        .empty { padding: 2rem; color: var(--muted); text-align: center; }
        .section-title { font-weight: 600; margin-bottom: 0.5rem; display: block; }
        .hint { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }

        /* ---- 视觉检查进度区 ---- */
        .check-progress {
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: #f0f4ff;
            border: 1px solid #c3d4f0;
            border-radius: 6px;
            display: none;
        }
        .check-progress.active { display: block; }
        .check-progress .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .check-progress .progress-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
        }
        .check-progress .progress-percent {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e7ff;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent3));
            transition: width 0.4s ease;
            border-radius: 5px;
        }
        .check-progress .current-task {
            margin-top: 0.5rem;
            font-size: 0.82rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .check-log {
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 5px;
            padding: 0.6rem;
            font-size: 0.8rem;
            font-family: "SF Mono", Consolas, monospace;
            line-height: 1.5;
        }
        .check-log .log-ok { color: #4ade80; }
        .check-log .log-warn { color: #fbbf24; }
        .check-log .log-err { color: #f87171; }
        .check-log .log-info { color: #93c5fd; }

        /* ---- API 配置 ---- */
        .api-config {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .api-config input {
            padding: 0.3rem 0.5rem;
            border: 1px solid var(--rule);
            border-radius: 4px;
            font-size: 0.8rem;
            width: 300px;
        }
        .api-status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .api-status-dot.online { background: var(--accent2); }
        .api-status-dot.offline { background: var(--warn); }
    </style>
</head>
<body>
<header>
    <h1>页面复刻结果浏览</h1>
    <p>选择已复刻日期，查看每场比赛的复刻/视觉对比统计，并在下方预览列表页。</p>
</header>
<main>
    <div class="card">
        <div class="row">
            <div>
                <label for="dateSelect">选择日期</label>
                <select id="dateSelect"></select>
            </div>
            <div>
                <label for="levelInput">最大层级</label>
                <input type="number" id="levelInput" value="3" min="1" max="5" disabled title="仅后端服务可调整">
            </div>
            <button id="viewBtn">查看数据</button>
            <button id="replicateBtn" class="secondary" title="后端服务在本地运行，点击后请告诉我你要复刻的日期">开始复刻</button>
            <button id="visualCheckBtn" class="purple" title="对已复刻的页面重新执行视觉对比检查">运行视觉检查</button>
            <button id="cancelCheckBtn" class="danger" style="display:none;">取消检查</button>
        </div>
        <div class="status" id="status"></div>

        <!-- API 配置 -->
        <div class="api-config">
            <label>API 服务地址</label>
            <input id="apiUrl" type="text" placeholder="http://localhost:5001" value="http://localhost:5001">
            <span id="apiStatus"><span class="api-status-dot offline" id="apiDot"></span><span id="apiText">未连接</span></span>
            <button id="testApiBtn" style="padding:0.25rem 0.6rem;font-size:0.8rem;" title="测试 API 连接">测试</button>
        </div>

        <!-- 视觉检查进度 -->
        <div class="check-progress" id="checkProgress">
            <div class="progress-header">
                <span class="progress-label" id="checkLabel">视觉检查进行中…</span>
                <span class="progress-percent" id="checkPercent">0%</span>
            </div>
            <div class="progress-bar"><div class="fill" id="checkFill"></div></div>
            <div class="current-task" id="checkCurrent"></div>
            <div class="check-log" id="checkLog"></div>
        </div>
    </div>

    <div class="card" id="statsCard" style="display:none;">
        <span class="section-title">比赛复刻统计</span>
        <div id="statsTableWrap"></div>
        <div class="hint">说明：L1 为整站列表页（1 面）；L2 为从列表页进入的赛事类型名称页 + 亚 + 欧 + 析（4 面）；L3 为从赛事类型页进入的亚/欧/析/大（4 面）加上从析页面进入的主队/客队资料库（2 面），合计 6 面。标签页统计主队/客队资料库内的各标签状态（赛程、阵容、球员数据等）。已对同一页面从不同域名的重复记录进行去重，避免实际计数超过应计数。</div>
    </div>

    <div class="card">
        <span class="section-title">复刻结果预览（第一层列表页）</span>
        <div class="actions" id="actions"></div>
        <div class="preview-wrapper" id="previewWrapper">
            <div class="empty" id="emptyMsg">加载中…</div>
        </div>
    </div>
</main>

<script>
let dates = [];
let currentMeta = null;
let checkPollTimer = null;

// ---- API 地址管理 ----

function getApiUrl() {
    const v = document.getElementById('apiUrl').value.trim();
    return v.replace(/\/+$/, ''); // 去掉末尾斜杠
}

async function testApiConnection() {
    const url = getApiUrl();
    const dot = document.getElementById('apiDot');
    const text = document.getElementById('apiText');
    try {
        const resp = await fetch(url + '/api/health', { signal: AbortSignal.timeout(3000) });
        const data = await resp.json();
        if (data.status === 'ok') {
            dot.className = 'api-status-dot online';
            const pw = data.playwright_available ? '像素级' : 'DOM 级';
            text.textContent = `已连接 (${pw}对比)`;
            return true;
        }
    } catch (e) {
        // try
    }
    dot.className = 'api-status-dot offline';
    text.textContent = '未连接';
    return false;
}

// ---- 日期和 meta 加载 ----

async function loadDates() {
    // 优先尝试从 API 获取
    const apiUrl = getApiUrl();
    try {
        const resp = await fetch(apiUrl + '/api/dates', { signal: AbortSignal.timeout(3000) });
        if (resp.ok) {
            dates = await resp.json();
            testApiConnection();
        } else {
            throw new Error('API 不可用');
        }
    } catch (e) {
        // 回退到本地 dates.json
        try {
            const resp = await fetch('dates.json');
            dates = await resp.json();
        } catch (e2) {
            dates = [];
        }
    }
    const select = document.getElementById('dateSelect');
    select.innerHTML = '';
    if (dates.length === 0) {
        select.innerHTML = '<option>暂无数据</option>';
        document.getElementById('emptyMsg').textContent = '暂无已复刻日期数据';
        return;
    }
    dates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.date;
        opt.textContent = d.date;
        select.appendChild(opt);
    });
    showDate(dates[0].date);
}

async function loadMeta(date) {
    // 优先尝试从 API 获取（带缓存破坏）
    const apiUrl = getApiUrl();
    try {
        const resp = await fetch(apiUrl + `/api/meta?date=${date}&cb=${Date.now()}`, { signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            return await resp.json();
        }
    } catch (e) {
        // fall through
    }
    // 回退到本地文件
    try {
        const resp = await fetch(`${date}/meta.json?cb=${Date.now()}`);
        if (!resp.ok) return null;
        return await resp.json();
    } catch (e) {
        return null;
    }
}

function isCompared(page) {
    return page && page.diff_ratio !== null && page.diff_ratio !== undefined && !isNaN(page.diff_ratio);
}

function calcMatchStats(match, pages) {
    const matchId = String(match.match_id || '');
    const homeId = String(match.home_team_id || '');
    const awayId = String(match.away_team_id || '');
    const league = String(match.league || '');

    const l1Pages = pages.filter(p => p.level === 1);
    const l1Compared = l1Pages.filter(isCompared).length;

    const detailUrlPatterns = [
        new RegExp('AsianOdds_n\\.aspx\\?id=' + matchId),
        new RegExp('oddslist/' + matchId + '\\.htm'),
        new RegExp('analysis/' + matchId + 'cn\\.htm'),
    ];
    const l2DetailSeen = new Set();
    const l2DetailPages = pages.filter(p => {
        if (p.level !== 2) return false;
        for (let i = 0; i < detailUrlPatterns.length; i++) {
            if (detailUrlPatterns[i].test(p.url || '')) {
                if (l2DetailSeen.has(i)) return false;
                l2DetailSeen.add(i);
                return true;
            }
        }
        return false;
    });
    const l2LeaguePages = pages.filter(p =>
        p.level === 2 &&
        /(?:SubLeague|CupMatch|League)\/\d+\.html/i.test(p.url || '') &&
        league &&
        (p.url || '').includes(matchId) === false
    );
    const hasL2LeagueCompared = l2LeaguePages.some(isCompared);
    const l2Compared = l2DetailPages.filter(isCompared).length + (hasL2LeagueCompared ? 1 : 0);

    const l3OverSeen = new Set();
    const l3OverPage = pages.filter(p => {
        if (!p.url || !p.url.includes('OverDown_n.aspx?id=' + matchId)) return false;
        if (l3OverSeen.has(matchId)) return false;
        l3OverSeen.add(matchId);
        return true;
    });
    const l3TeamSeen = new Set();
    const l3TeamPages = pages.filter(p => {
        const m = p.url && p.url.match(/team\/(?:Summary\/)?(\d+)\.html/i);
        if (!m) return false;
        const tid = m[1];
        if (tid !== homeId && tid !== awayId) return false;
        if (l3TeamSeen.has(tid)) return false;
        l3TeamSeen.add(tid);
        return true;
    });
    const l3Compared =
        l2DetailPages.filter(isCompared).length +
        l3OverPage.filter(isCompared).length +
        l3TeamPages.filter(isCompared).length;

    const tabSeen = new Set();
    const teamTabPages = pages.filter(p => {
        if (p.type !== 'team_tab') return false;
        const m = p.url && p.url.match(/team\/([A-Za-z]+)\/(\d+)\.html/i);
        if (!m) return false;
        const tabName = m[1].toLowerCase();
        const tid = m[2];
        if (tid !== homeId && tid !== awayId) return false;
        const key = tabName + '_' + tid;
        if (tabSeen.has(key)) return false;
        tabSeen.add(key);
        return true;
    });
    const tabCompared = teamTabPages.filter(isCompared).length;

    const teamCount = (homeId ? 1 : 0) + (awayId && awayId !== homeId ? 1 : 0);

    return {
        l1: { expected: 1, compared: l1Compared },
        l2: { expected: 1 + detailUrlPatterns.length, compared: l2Compared },
        l3: { expected: detailUrlPatterns.length + 1 + teamCount, compared: l3Compared },
        tab: { expected: teamTabPages.length, compared: tabCompared },
    };
}

function renderStats(item, meta) {
    const pages = (meta && meta.pages) || [];
    const matches = item.matches || [];
    const wrap = document.getElementById('statsTableWrap');
    const card = document.getElementById('statsCard');

    if (!matches.length) {
        card.style.display = 'none';
        wrap.innerHTML = '';
        return;
    }

    // 如果有视觉检查时间，显示在标题旁
    let titleExtra = '';
    if (meta && meta.visual_check_at) {
        const checkTime = new Date(meta.visual_check_at).toLocaleString('zh-CN');
        const mode = meta.visual_check_mode === 'pixel' ? '像素级' : 'DOM 级';
        titleExtra = ` <span style="font-weight:normal;color:var(--muted);font-size:0.8rem;">（上次检查: ${checkTime} · ${mode}）</span>`;
    }

    let html = `<table class="stats-table">
        <thead>
            <tr>
                <th>联赛</th>
                <th>开赛时间</th>
                <th>主队</th>
                <th>客队</th>
                <th>状态</th>
                <th class="num">L1 应复刻 / 已视觉对比</th>
                <th class="num">L2 应复刻 / 已视觉对比</th>
                <th class="num">L3 应复刻 / 已视觉对比</th>
                <th class="num">标签页 总数 / 已视觉对比</th>
            </tr>
        </thead>
        <tbody>`;

    for (const match of matches) {
        const s = calcMatchStats(match, pages);
        const l1Cls = s.l1.compared >= s.l1.expected ? 'ok' : 'warn';
        const l2Cls = s.l2.compared >= s.l2.expected ? 'ok' : 'warn';
        const l3Cls = s.l3.compared >= s.l3.expected ? 'ok' : 'warn';
        const tabCls = s.tab.compared >= s.tab.expected ? 'ok' : 'warn';
        html += `<tr>
            <td>${escapeHtml(match.league || '-')}</td>
            <td>${escapeHtml(match.match_time || '-')}</td>
            <td>${escapeHtml(match.home_team || '-')}</td>
            <td>${escapeHtml(match.away_team || '-')}</td>
            <td>${escapeHtml(match.status || '-')}</td>
            <td class="num ${l1Cls}">${s.l1.expected} / ${s.l1.compared}</td>
            <td class="num ${l2Cls}">${s.l2.expected} / ${s.l2.compared}</td>
            <td class="num ${l3Cls}">${s.l3.expected} / ${s.l3.compared}</td>
            <td class="num ${tabCls}">${s.tab.expected} / ${s.tab.compared}</td>
        </tr>`;
    }

    html += '</tbody></table>';
    wrap.innerHTML = html;
    card.style.display = 'block';

    // 更新标题
    const titleEl = card.querySelector('.section-title');
    if (titleEl) {
        titleEl.innerHTML = '比赛复刻统计' + titleExtra;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function showDate(date) {
    const item = dates.find(d => d.date === date);
    const wrapper = document.getElementById('previewWrapper');
    const status = document.getElementById('status');
    const actions = document.getElementById('actions');
    const statsCard = document.getElementById('statsCard');

    if (!item) {
        wrapper.innerHTML = '<div class="empty">未找到该日期数据</div>';
        status.textContent = '';
        actions.innerHTML = '';
        statsCard.style.display = 'none';
        return;
    }

    currentMeta = await loadMeta(date);
    renderStats(item, currentMeta);

    actions.innerHTML = `<a href="${item.list_page}" target="_blank">在新标签页打开原始复刻列表页 ↗</a>`;
    wrapper.innerHTML = `<iframe src="${item.list_page}" sandbox="allow-scripts allow-same-origin allow-popups allow-top-navigation allow-top-navigation-by-user-activation"></iframe>`;
    status.textContent = `已加载 ${date}，共 ${item.matches.length} 场比赛`;
}

// ---- 视觉检查逻辑 ----

function appendLog(text, cls) {
    const log = document.getElementById('checkLog');
    const line = document.createElement('div');
    line.className = cls || 'log-info';
    line.textContent = text;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
}

async function startVisualCheck() {
    const date = document.getElementById('dateSelect').value;
    const apiUrl = getApiUrl();

    // 测试 API 是否可用
    const ok = await testApiConnection();
    if (!ok) {
        alert('API 服务未连接。请在本地启动 API 服务器:\n\n  cd /data/user/work/page-replica-v2\n  python3 api/server.py\n\n然后修改上方的 API 地址并点击「测试」按钮。');
        return;
    }

    const checkBtn = document.getElementById('visualCheckBtn');
    const cancelBtn = document.getElementById('cancelCheckBtn');
    const progress = document.getElementById('checkProgress');
    const log = document.getElementById('checkLog');

    checkBtn.disabled = true;
    cancelBtn.style.display = '';
    progress.classList.add('active');
    log.innerHTML = '';
    appendLog(`[${new Date().toLocaleTimeString('zh-CN')}] 启动视觉检查: ${date}`, 'log-info');

    try {
        const resp = await fetch(apiUrl + '/api/visual-check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date: date, use_playwright: false }),
        });
        const data = await resp.json();

        if (!resp.ok) {
            appendLog(`错误: ${data.error || '启动失败'}`, 'log-err');
            checkBtn.disabled = false;
            cancelBtn.style.display = 'none';
            return;
        }

        appendLog(data.message, 'log-info');

        // 开始轮询状态
        pollCheckStatus();

    } catch (e) {
        appendLog(`请求失败: ${e.message}`, 'log-err');
        checkBtn.disabled = false;
        cancelBtn.style.display = 'none';
    }
}

function pollCheckStatus() {
    if (checkPollTimer) clearInterval(checkPollTimer);

    const apiUrl = getApiUrl();
    checkPollTimer = setInterval(async () => {
        try {
            const resp = await fetch(apiUrl + '/api/visual-check/status');
            const data = await resp.json();

            // 更新进度条
            const fill = document.getElementById('checkFill');
            const percent = document.getElementById('checkPercent');
            const label = document.getElementById('checkLabel');
            const current = document.getElementById('checkCurrent');

            const pct = data.percent || 0;
            fill.style.width = pct + '%';
            percent.textContent = pct.toFixed(1) + '%';

            if (data.running) {
                label.textContent = `视觉检查进行中… (${data.progress})`;
                if (data.current_url) {
                    current.textContent = `正在检查: ${data.current_type} — ${data.current_url}`;
                }
            } else {
                label.textContent = `视觉检查完成 (${data.progress})`;
                current.textContent = '';
            }

            // 输出最近的结果
            if (data.results && data.results.length > 0) {
                // 只显示新增的结果（对比已显示的数量）
                const displayed = parseInt(progressEl.dataset.displayed || '0');
                const newResults = data.results.slice(displayed);
                for (const r of newResults) {
                    let cls = 'log-info';
                    if (r.status === 'ok') cls = 'log-ok';
                    else if (r.status === 'needs_fix' || r.status === 'error') cls = 'log-err';
                    else if (r.status === 'ok_with_diff') cls = 'log-warn';
                    const pctStr = r.diff_ratio !== null ? ` (${(r.diff_ratio * 100).toFixed(2)}%)` : '';
                    appendLog(`[${r.type_name}] ${r.status}${pctStr} — ${r.message}`, cls);
                }
                progressEl.dataset.displayed = data.results.length;
            }

            // 检查是否完成
            if (!data.running) {
                clearInterval(checkPollTimer);
                checkPollTimer = null;

                // 显示错误
                if (data.errors && data.errors.length > 0) {
                    for (const e of data.errors) {
                        appendLog(`[错误] ${e}`, 'log-err');
                    }
                }

                appendLog(`[${new Date().toLocaleTimeString('zh-CN')}] 检查完成!`, 'log-info');

                // 重新加载 meta.json 并更新统计表
                const date = document.getElementById('dateSelect').value;
                appendLog('正在更新统计表…', 'log-info');
                currentMeta = await loadMeta(date);
                const item = dates.find(d => d.date === date);
                if (item && currentMeta) {
                    renderStats(item, currentMeta);
                    appendLog('统计表已更新', 'log-ok');
                }

                // 恢复按钮状态
                document.getElementById('visualCheckBtn').disabled = false;
                document.getElementById('cancelCheckBtn').style.display = 'none';
            }
        } catch (e) {
            // 网络错误，继续重试
            console.error('轮询失败:', e);
        }
    }, 1500);
}

async function cancelVisualCheck() {
    const apiUrl = getApiUrl();
    try {
        await fetch(apiUrl + '/api/visual-check/cancel', { method: 'POST' });
        appendLog('正在取消…（将在当前页面完成后停止）', 'log-warn');
    } catch (e) {
        appendLog(`取消请求失败: ${e.message}`, 'log-err');
    }
}

const progressEl = document.getElementById('checkProgress');

document.getElementById('viewBtn').onclick = () => {

};

document.getElementById('replicateBtn').onclick = () => {

document.getElementById('visualCheckBtn').onclick = startVisualCheck;
document.getElementById('cancelCheckBtn').onclick = cancelVisualCheck;

window.addEventListener('load', () => {

});

loadDates();
